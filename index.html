<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="mono">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <title>Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <section class="calendar" id="calendar" aria-label="Calendar"></section>
    <main class="panel" id="panel"></main>
  </div>

  <button class="fab" id="add-btn" aria-label="Add to-do or schedule">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav class="tabbar" aria-label="Tabs">
    <button class="tab active" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Calendar</span>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <dialog class="sheet" id="editor"></dialog>
  <dialog class="sheet" id="settings"></dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
