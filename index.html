<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="mono">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <title>Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preload" href="fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="view month-mode" id="view-calendar">
    <img class="brand" src="icons/icon.svg" alt="" aria-hidden="true">
    <button class="bell" id="bell" aria-label="Notifications" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 2h-14z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
      <span class="bell-badge" hidden></span>
    </button>
    <div class="grow top-slot">
      <div id="dday-slot"></div>
    </div>
    <section class="calendar" id="calendar" aria-label="Calendar"></section>
    <main class="panel" id="panel"></main>
    <div class="grow" aria-hidden="true"></div>
  </div>

  <div class="view" id="view-login" hidden></div>

  <div class="view" id="view-dday" hidden></div>

  <div class="view" id="view-settings" hidden></div>

  <nav class="tabbar" aria-label="Tabs">
    <button class="tab" data-view="calendar" aria-label="Calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    </button>
    <button class="tab" data-view="dday" aria-label="D-Day">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h10M7 20.5h10M8 3.5v3.2c0 1.6.8 3 2.1 3.9L12 12l1.9-1.4A4.8 4.8 0 0 0 16 6.7V3.5M8 20.5v-3.2c0-1.6.8-3 2.1-3.9L12 12l1.9 1.4a4.8 4.8 0 0 1 2.1 3.9v3.2"/></svg>
    </button>
    <button class="tab" data-view="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <dialog class="sheet" id="editor"></dialog>
  <dialog class="sheet" id="folder-sheet"></dialog>
  <dialog class="sheet" id="dday-sheet"></dialog>
  <dialog class="sheet account-sheet" id="account-sheet"></dialog>
  <dialog class="sheet social-sheet" id="social-sheet"></dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
