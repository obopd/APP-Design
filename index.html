<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="mono">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <title>Planner</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preload" href="fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="view month-mode" id="view-calendar">
    <button class="brand" id="brand" aria-label="Planner">
      <img class="brand-face brand-cal" src="icons/icon.svg" alt="" draggable="false">
      <svg class="brand-face brand-slate" viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" fill="#0a0a0a"/>
        <rect x="136" y="214" width="240" height="162" rx="30" fill="none" stroke="#fff" stroke-width="26"/>
        <circle cx="256" cy="300" r="22" fill="#fff"/>
        <g class="slate-arm">
          <rect x="128" y="146" width="256" height="48" rx="12" fill="#fff"/>
          <path d="M190 146l-30 48M252 146l-30 48M314 146l-30 48M376 146l-30 48" stroke="#0a0a0a" stroke-width="20"/>
        </g>
      </svg>
    </button>
    <button class="bell" id="bell" aria-label="Notifications" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 2h-14z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
      <span class="bell-badge" hidden></span>
    </button>
    <div class="grow top-slot">
      <div id="dday-slot"></div>
    </div>
    <section class="calendar" id="calendar" aria-label="Calendar"></section>
    <section class="expanded" id="expanded" aria-label="Expanded calendar" hidden></section>
    <div class="x-frame" id="x-frame" aria-hidden="true" hidden></div>
    <main class="panel" id="panel"></main>
    <div class="grow" aria-hidden="true"></div>
  </div>

  <div class="view" id="view-login" hidden></div>

  <div class="view" id="view-dday" hidden></div>

  <div class="view" id="view-write" hidden></div>

  <div class="view" id="view-organize" hidden></div>

  <div class="view" id="view-preview" hidden></div>

  <div class="view" id="view-chat" hidden></div>

  <div class="view" id="view-settings" hidden></div>

  <nav class="tabbar" aria-label="Tabs">
    <button class="tab" data-view="calendar" aria-label="Calendar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    </button>
    <button class="tab" data-view="dday" aria-label="D-Day">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h10M7 20.5h10M8 3.5v3.2c0 1.6.8 3 2.1 3.9L12 12l1.9-1.4A4.8 4.8 0 0 0 16 6.7V3.5M8 20.5v-3.2c0-1.6.8-3 2.1-3.9L12 12l1.9 1.4a4.8 4.8 0 0 1 2.1 3.9v3.2"/></svg>
    </button>
    <button class="tab" data-view="write" aria-label="Write">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19.5l1.2-4.4L16.4 4.9a2 2 0 0 1 2.8 0l-.1-.1a2 2 0 0 1 0 2.8L9 17.8z"/><path d="M14.5 6.8l2.8 2.8M13 19.5h6.5"/></svg>
    </button>
    <button class="tab" data-view="organize" aria-label="Organize">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4.5" width="14" height="16" rx="2.5"/><path d="M9 4.5V3.6h6v.9M8.5 10h7M8.5 13.5h7M8.5 17h4"/></svg>
    </button>
    <button class="tab" data-view="preview" aria-label="Preview">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="M10.2 9.4v5.2l4.4-2.6z"/></svg>
    </button>
    <button class="tab" data-view="chat" aria-label="Chat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 11.5c0-4 3.4-7 7.5-7s7.5 3 7.5 7-3.4 7-7.5 7c-1.1 0-2.2-.2-3.1-.6L4.5 19.5l1.2-3.6a6.7 6.7 0 0 1-1.2-4.4z"/></svg>
      <span class="tab-badge" hidden></span>
    </button>
    <button class="tab" data-view="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
    </button>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <dialog class="sheet" id="editor"></dialog>
  <dialog class="sheet" id="folder-sheet"></dialog>
  <dialog class="sheet" id="dday-sheet"></dialog>
  <dialog class="sheet account-sheet" id="account-sheet"></dialog>
  <dialog class="sheet social-sheet" id="social-sheet"></dialog>
  <dialog class="sheet" id="org-sheet"></dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
